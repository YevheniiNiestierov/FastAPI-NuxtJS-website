services:
  db:
    image: postgres:16-alpine
    container_name: soap_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=soap_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./app
    container_name: soap_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/soap_db
      - PYTHONUNBUFFERED=1  # <--- FIXES LOGS
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: soap_frontend
    restart: always
    environment:
      # Use NUXT_PUBLIC_ prefix + your variable name from nuxt.config.ts
      # Use the PUBLIC URL so the browser can reach the API
      - NUXT_PUBLIC_API_BASE=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
