services:
  db:
    image: postgres:16-alpine
    container_name: soap_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-soap}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-soap_password}
      - POSTGRES_DB=${POSTGRES_DB:-soap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./app
    container_name: soap_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-soap}:${POSTGRES_PASSWORD:-soap_password}@db:5432/${POSTGRES_DB:-soap}
      - PYTHONUNBUFFERED=1  # <--- FIXES LOGS
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: soap_frontend
    restart: always
    environment:
      # Use NUXT_PUBLIC_ prefix + your variable name from nuxt.config.ts
      # Use the PUBLIC URL so the browser can reach the API
      - NUXT_PUBLIC_API_BASE=https://api.natur-savon.com.ua
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
