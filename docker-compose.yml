services:
  db:
    image: postgres:16-alpine
    container_name: soap_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-soap}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-soap_password}
      - POSTGRES_DB=${POSTGRES_DB:-soap}
    ports:
      - "127.0.0.1:5433:5432"  # local access only (host port 5433)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./app
    container_name: soap_backend
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-soap}:${POSTGRES_PASSWORD:-soap_password}@db:5432/${POSTGRES_DB:-soap}
      - PYTHONUNBUFFERED=1
      # Local: no CDN, images are served through the API
      - CDN_BASE=
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: soap_frontend
    restart: always
    environment:
      # Local: the browser talks to the API on localhost, no CDN
      - NUXT_PUBLIC_API_BASE=http://localhost:8000
      - NUXT_PUBLIC_CDN_BASE=
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

